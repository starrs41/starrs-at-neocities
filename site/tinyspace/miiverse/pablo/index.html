<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miiverse - Pablo</title>
  <link rel="stylesheet" href="../miiverse-globals.css">
  <link rel="stylesheet" href="miiverse-pablo.css">
</head>
<body>
  <div class="o-navbar">
    <div class="o-navbar__left">
      <a href="../">Home</a>
    </div>
    <div class="o-navbar__right">
      <button>Music: OFF</button>
      <button>Animations: OFF</button>
    </div>
  </div>
  <div class="o-main--mii">
    <div class="o-mii-summary">
      <div class="o-mii-summary__portrait-container">
        <img class="o-mii-summary__portrait" src="../../../graphics/misc/miiverse/pablo/pablo-idle.gif" alt="Pablo idling" />
      </div>
      <div class="o-mii-summary__bio">
        <h1 class="o-mii-summary__name">
          Pablo
        </h1>
        <div class="o-mii-summary__character">
          This mii doesn't have much plans of his own, going along with whatever life throws at him. It's hard to see with his shades and his general laid-back attitude, but he cares deeply about his friends and does what he can to be there for them.
        </div>
      </div>
    </div>
    <div class="o-mii-details">
      Details
    </div>
    <div class="o-mii-gallery">
      Gallery
    </div>
  </div>
</body>
</html>
